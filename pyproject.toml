[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qalf-deepfake"
version = "0.1.0"
description = "Lightweight texture-only deepfake video detection"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.11,<5",
  "mediapipe==1.0.0",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
export = ["onnx>=1.16,<2"]
dev = ["ruff>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["qalf*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
