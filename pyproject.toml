[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qalf-deepfake"
version = "0.1.0"
description = "Quality-aware landmark-texture fusion for deepfake video detection"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["qalf*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
